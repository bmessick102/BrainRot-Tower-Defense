<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Phones: no pinch / double-tap page zoom (the game has its own pinch zoom on the map). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Italian Brainrot Tower Defense</title>
    <!-- App and browser icons: the start screen's background with the game logo centered (docs/branding/app_icon.png).
         The share preview (og-image.png) is made from docs/branding/Italian_Brainrot_TD_Logo.png. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Add to Home Screen: opens full screen, sideways, like an app (the only full screen on iPhone). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#10140f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Brainrot TD" />
    <meta property="og:title" content="Italian Brainrot Tower Defense" />
    <meta property="og:image" content="og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; background: #10140f; overflow: hidden;
        overscroll-behavior: none; /* no pull-to-refresh or bounce */
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
      }
      /* Fixed to the visible screen: 100vh on phones runs under the address bar. */
      #game { position: fixed; inset: 0; touch-action: none; }
      canvas { display: block; touch-action: none; }
      /* Typing boxes (login, names) still select text normally. */
      input { -webkit-user-select: text; user-select: text; }

      /* Phones held upright: ask to turn sideways (the game is laid out for a landscape screen). */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #10140f; color: #fff6d8;
        flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;
        font: bold 22px/1.35 "Trebuchet MS", system-ui, sans-serif; padding: 24px; box-sizing: border-box;
      }
      #rotate img { width: 140px; height: auto; border-radius: 24px; }
      #rotate .rotate-badge {
        display: grid; place-items: center; width: 120px; height: 108px; border-radius: 18px;
        border: 3px solid #f2a227; background: linear-gradient(#425972, #253348);
        box-shadow: 0 4px #0a1119, inset 0 2px #ffffff45;
      }
      #rotate .phone {
        position: relative; width: 38px; height: 65px; box-sizing: border-box;
        border: 4px solid #ffdc88; border-radius: 8px; background: linear-gradient(150deg, #71afcf, #325976);
        box-shadow: 0 0 0 2px #182331, inset 0 0 0 2px #182331, 2px 3px #152130;
        animation: turn 2.2s ease-in-out infinite;
      }
      #rotate .phone::after {
        content: ''; position: absolute; bottom: 3px; left: 9px; width: 12px; height: 3px;
        border-radius: 2px; background: #ffdc88;
      }
      #rotate small { font-size: 16px; color: #c9bfa3; font-weight: normal; }
      @keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-45deg); } }
      @media (max-height: 440px) { #rotate { gap: 12px; } #rotate img { width: 100px; } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-live="polite">
      <img src="apple-touch-icon.png" alt="" />
      <div class="rotate-badge" aria-hidden="true"><div class="phone"></div></div>
      <div>Turn your phone sideways to play</div>
      <small>Tip: Add to Home Screen to play full screen</small>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
